<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Take the survey — IGRIS Business Pulse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
<script src="/env-config.js"></script>
</head>
<body class="bg-white text-[var(--ink)] min-h-screen flex flex-col">
  <script type="module" src="/src/main.jsx"></script>

<header class="border-b border-[var(--line)]">
  <div class="max-w-2xl mx-auto px-6 sm:px-8 py-5 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <img src="assets/igris-logo.png" alt="IGRIS Technologies" class="h-7 w-auto" />
      <span class="font-semibold tracking-tight text-[15px]">IGRIS</span>
    </a>
    <a href="/" class="text-sm text-[var(--muted)] link-underline">Exit survey</a>
  </div>
</header>

<main class="flex-1 max-w-2xl mx-auto w-full px-6 sm:px-8 py-14 sm:py-20 flex flex-col">
  <div class="mb-10">
    <div class="flex justify-between items-baseline mb-3">
      <span id="q-counter" class="text-sm text-[var(--muted)]"></span>
    </div>
    <div class="h-[2px] bg-[var(--line)] w-full">
      <div id="progress-fill" class="progress-fill h-[2px] bg-[var(--ink)]" style="width:0%"></div>
    </div>
  </div>

  <div id="survey-stage" class="flex-1"></div>
  <div id="survey-live" class="sr-only" aria-live="polite"></div>

  <div class="flex items-center justify-between mt-12 pt-6 border-t border-[var(--line)]">
    <button id="btn-back" type="button" class="text-sm text-[var(--muted)] hover:text-[var(--ink)] disabled:cursor-not-allowed">
      ← Back
    </button>
    <button id="btn-continue" type="button" class="arrow-cta inline-flex items-center gap-2 bg-[var(--ink)] text-white px-7 py-3.5 text-sm hover:opacity-90 disabled:cursor-not-allowed">
      Continue <span class="arrow-glyph">→</span>
    </button>
  </div>
</main>

<script src="data/questions.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/api-client.js"></script>
<script src="js/data-store.js"></script>
<script src="js/survey.js"></script>
</body>
</html>
